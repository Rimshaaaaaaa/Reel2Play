[project]
name = "reel2play"
version = "0.1.0"
description = "Reel2Play API: turns a shop's Reel into a tested, playable mini-game ad."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "esprima>=4.0.1",
    "fastapi>=0.115",
    "httpx>=0.28",
    "modal>=1.6",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "playwright==1.63.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "segno>=1.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
reel2play = "reel2play.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "RET", "C4"]
ignore = ["S101"]
# Urdu is part of the product: these letters are not look-alikes in Urdu text.
allowed-confusables = ["۔", "ہ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# esprima (a JavaScript parser, feature 24) ships without type hints.
module = ["esprima", "esprima.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs PostgreSQL",
]
filterwarnings = [
    "error::DeprecationWarning:reel2play.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["src/reel2play"]
branch = true
# The play-test harness runs as a subprocess; measure it there too.
patch = ["subprocess"]
parallel = true
# Playwright's sync API runs on greenlets.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
